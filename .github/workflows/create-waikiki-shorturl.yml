name: Create Short URL for Waikiki Map

on:
  push:
    paths:
      - '.github/workflows/create-waikiki-shorturl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Shorten published map URL
        env:
          TARGET_URL: https://rawcdn.githack.com/taka-hamashita/section-display-web/4e2e15e0a36a0569111dbdacabae59b03c694636/public/waikiki-breakfast/index.html
        run: |
          set -euo pipefail
          short_url="$(curl -fsS --max-time 20 -G \
            --data-urlencode "format=simple" \
            --data-urlencode "url=$TARGET_URL" \
            --data-urlencode "shorturl=OS_Hawaii26_Breakfast" \
            https://is.gd/create.php || true)"
          if [[ "$short_url" != https://is.gd/* ]]; then
            echo "Requested alias not available; retrying with automatic code."
            short_url="$(curl -fsS --max-time 20 -G \
              --data-urlencode "format=simple" \
              --data-urlencode "url=$TARGET_URL" \
              https://is.gd/create.php)"
          fi
          if [[ "$short_url" != https://is.gd/* ]]; then
            echo "Shortening failed: $short_url"
            exit 1
          fi
          echo "SHAREABLE_SHORT_URL=$short_url"
          echo "Verifying redirect..."
          curl -fsSI --max-time 20 "$short_url" | head -n 15

name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel settings
        run: npx -y vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx -y vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy
        run: npx -y vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
